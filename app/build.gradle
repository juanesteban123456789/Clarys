plugins {
    id 'com.android.application'
}

def localProperties = new Properties()
def localPropertiesFile = rootProject.file("local.properties")
if (localPropertiesFile.exists()) {
    localPropertiesFile.withInputStream { stream -> localProperties.load(stream) }
}
def configurationValue = { String name ->
    localProperties.getProperty(name)
            ?: System.getenv(name)
            ?: project.findProperty(name)?.toString()
            ?: ""
}
def googleWebClientId = configurationValue("GOOGLE_WEB_CLIENT_ID")
def releaseKeystorePath = configurationValue("CLARYS_KEYSTORE_PATH")
def releaseKeystorePassword = configurationValue("CLARYS_KEYSTORE_PASSWORD")
def releaseKeyAlias = configurationValue("CLARYS_KEY_ALIAS")
def releaseKeyPassword = configurationValue("CLARYS_KEY_PASSWORD")
def hasReleaseSigning = [
        releaseKeystorePath,
        releaseKeystorePassword,
        releaseKeyAlias,
        releaseKeyPassword
].every { !it.trim().isEmpty() }

android {
    namespace 'com.clarys.app'
    compileSdk 36

    flavorDimensions += "audience"

    defaultConfig {
        applicationId "com.clarys.app"
        minSdk 24
        targetSdk 36
        versionCode 2
        versionName "1.1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        buildConfigField "String", "SUPABASE_URL", "\"https://mzqvmddxxlzjfruksgnz.supabase.co\""
        buildConfigField "String", "SUPABASE_PUBLISHABLE_KEY", "\"sb_publishable_ZtQnavM3WfR1VTqIhA9RnA_3XV3V6fR\""
        buildConfigField "String", "GOOGLE_WEB_CLIENT_ID", "\"${googleWebClientId}\""
    }

    productFlavors {
        admin {
            dimension "audience"
            buildConfigField "boolean", "IS_ADMIN_APP", "true"
        }

        cliente {
            dimension "audience"
            applicationIdSuffix ".catalogo"
            versionNameSuffix "-catalogo"
            buildConfigField "boolean", "IS_ADMIN_APP", "false"
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile rootProject.file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled true
            shrinkResources true
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            }
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        buildConfig true
        viewBinding true
    }

}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'com.google.android.material:material:1.12.0'
    implementation 'androidx.recyclerview:recyclerview:1.3.2'
    implementation 'com.squareup.okhttp3:okhttp:4.12.0'
    implementation 'com.github.bumptech.glide:glide:4.16.0'
    implementation 'com.google.android.gms:play-services-auth:21.2.0'

    testImplementation 'junit:junit:4.13.2'
    androidTestImplementation 'androidx.test.ext:junit:1.2.1'
    androidTestImplementation 'androidx.test.espresso:espresso-core:3.6.1'
}

tasks.register("verifyProductionConfiguration") {
    group = "verification"
    description = "Verifica firma y Google OAuth antes de generar una entrega productiva."
    doLast {
        if (!hasReleaseSigning) {
            throw new GradleException(
                    "Falta configurar la firma release de Clarys en propiedades locales o variables de entorno."
            )
        }
        if (googleWebClientId.trim().isEmpty()) {
            throw new GradleException("Falta configurar GOOGLE_WEB_CLIENT_ID para producción.")
        }
    }
}
